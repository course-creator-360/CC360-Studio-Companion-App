kind = "web"
previewPath = "/"
title = "Creator 360"
version = "1.0.0"
id = "artifacts/creator-360"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24397

[services.development]
run = "pnpm --filter @workspace/creator-360 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/creator-360", "run", "build" ]
publicDir = "artifacts/creator-360/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24397"
BASE_PATH = "/"
